<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | DAG Ethiopian Coffee</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section" style="max-width:720px;margin:auto;text-align:center"><p class="eyebrow">DAG ETHIOPIAN COFFEE</p><h1 style="font-family:Georgia,serif">Checking your payment</h1><p id="status">Please wait while we verify your transaction with the payment provider.</p><a class="btn btn-dark" href="/">Return to website</a></main><script> (async()=>{const ref=new URLSearchParams(location.search).get("order");const el=document.getElementById("status");if(!ref){el.textContent="No order reference was provided. Please contact us.";return;}try{const r=await fetch("/api/payments/verify/"+encodeURIComponent(ref),{method:"POST"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Payment is not confirmed yet.");el.textContent="Payment confirmed for order "+d.orderRef+". Thank you for ordering from DAG Ethiopian Coffee.";}catch(e){el.textContent=e.message+" If you completed payment, please contact DAG Ethiopian Coffee with your order reference: "+ref;}})(); </script></body></html>
